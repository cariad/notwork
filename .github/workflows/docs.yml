name: docs

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: docs-workflow-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_LOCKED: 1

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          version: 2026.10.23

      - name: Build the documentation site
        run: mise run docs:build

      - name: Upload the artefact to be published
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    needs: build

    concurrency:
      cancel-in-progress: false
      group: pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      id-token: write
      pages: write

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Publish the documentation site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
