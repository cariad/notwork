name: ci

on:
  pull_request:
    branches:
      - main

permissions: {}

env:
  MISE_LOCKED: 1

jobs:
  build-docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          version: 2026.10.23

      - name: Build the documentation site
        run: mise run docs:build

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          version: 2026.10.23

      - name: Lint files against .editorconfig
        run: mise run lint:editorconfig

      - name: Lint Markdown files
        run: mise run lint:markdown

      - name: Lint Python files
        run: mise run lint:python

      - name: Lint TOML files
        run: mise run lint:toml

      - name: Check types
        run: mise run lint:types

      - name: Audit GitHub Actions files
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run lint:workflows

  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          version: 2026.10.23

      - name: Run the tests
        run: mise run test
